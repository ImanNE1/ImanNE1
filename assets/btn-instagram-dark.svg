<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="276" height="66" viewBox="0 0 276 66" fill="none">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif; }
  .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.4deg); }
    50% { transform: rotate(2.4deg); }
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0px); opacity: 0.72; }
    50% { transform: translateY(-7px); opacity: 1; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.82); }
  }
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spinCCW {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes scanX {
    0% { transform: translateX(-180px); opacity: 0; }
    20% { opacity: 0.85; }
    80% { opacity: 0.85; }
    100% { transform: translateX(1240px); opacity: 0; }
  }
  
</style>
<defs>

      <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#152130"/>
        <stop offset="100%" stop-color="#1A283A"/>
      </linearGradient>
    
</defs>
  <path d="M 13.5,1.5 H 274.5 V 52.5 L 262.5,64.5 H 1.5 V 13.5 Z" fill="url(#btnBg)" stroke="#263B52" stroke-width="1.4"/>
  <rect x="1.5" y="12" width="4" height="42" fill="#E06C75"/>
  <polygon points="252,14 258,8 264,14 258,20" fill="#E06C75"/>
  <text x="18" y="23" class="mono" font-size="10" font-weight="800" letter-spacing="1.4" fill="#E06C75">CH-03 // INSTAGRAM</text>
  <text x="18" y="47" class="sans" font-size="13" font-weight="800" fill="#F7F3E6">@immanuelkristiandika</text>
  <text x="262" y="55" text-anchor="end" class="mono" font-size="9" font-weight="700" fill="#8295AB">OPEN ↗</text>
</svg>