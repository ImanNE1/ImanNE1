<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="52" viewBox="0 0 1200 52" fill="none">
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif; }
  .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
  @keyframes sway {
    0%, 100% { transform: rotate(-2.4deg); }
    50% { transform: rotate(2.4deg); }
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0px); opacity: 0.72; }
    50% { transform: translateY(-7px); opacity: 1; }
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.82); }
  }
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spinCCW {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes scanX {
    0% { transform: translateX(-180px); opacity: 0; }
    20% { opacity: 0.85; }
    80% { opacity: 0.85; }
    100% { transform: translateX(1240px); opacity: 0; }
  }
  
</style>
<defs>

      <linearGradient id="secLine" gradientUnits="userSpaceOnUse" x1="418" y1="0" x2="974" y2="0">
        <stop offset="0%" stop-color="#1695A8"/>
        <stop offset="55%" stop-color="#C98712"/>
        <stop offset="100%" stop-color="#DFC993" stop-opacity="0.25"/>
      </linearGradient>
    
</defs>
  <g>
    <path d="M 12,10 H 56 V 34 L 48,42 H 4 V 18 Z" fill="#19535B"/>
    <text x="30" y="31" text-anchor="middle" class="mono" font-size="14" font-weight="800" fill="#FFFDF7">01</text>
