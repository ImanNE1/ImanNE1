    <text x="96" y="31" class="mono" font-size="15" font-weight="800" letter-spacing="2" fill="#18222F">OPERATOR DOSSIER // 人事記録</text>
    <rect x="418" y="25" width="556" height="2" fill="url(#secLine)"/>
    <rect x="418" y="24.5" width="46" height="3" fill="#22B2C2" opacity="0.95"/>
